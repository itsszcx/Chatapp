<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wire — direct chat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --paper: #FAF7F2;
    --ink: #1F2937;
    --ink-soft: #6B7280;
    --accent: #2A7F73;
    --accent-dark: #1E5D54;
    --clay: #E8DFD3;
    --line: #DDD4C6;
    --danger: #B3441E;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  #app {
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  .screen {
    display: none;
    flex: 1;
    flex-direction: column;
    height: 100%;
  }
  .screen.active { display: flex; }

  /* ---------- Shared bits ---------- */
  .center-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .panel {
    width: 100%;
    max-width: 380px;
  }

  .wordmark {
    font-size: 15px;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }

  h1 {
    font-size: 28px;
    font-weight: 600;
    margin: 0 0 28px 0;
    line-height: 1.2;
  }

  label {
    display: block;
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 6px;
    margin-top: 16px;
  }

  input[type="email"],
  input[type="password"],
  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: #fff;
    color: var(--ink);
    outline: none;
  }
  input:focus {
    border-color: var(--accent);
  }

  button {
    font-family: inherit;
    cursor: pointer;
  }

  .btn-primary {
    width: 100%;
    margin-top: 22px;
    padding: 13px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 15px;
    font-weight: 600;
  }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-primary:disabled { background: var(--line); cursor: default; }

  .link-btn {
    background: none;
    border: none;
    color: var(--accent-dark);
    font-size: 14px;
    padding: 0;
    text-decoration: underline;
  }

  .switch-row {
    margin-top: 18px;
    font-size: 14px;
    color: var(--ink-soft);
    text-align: center;
  }

  .error-text {
    color: var(--danger);
    font-size: 13px;
    margin-top: 10px;
    min-height: 16px;
  }

  /* ---------- Home screen ---------- */
  .home-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .home-header .wordmark { margin: 0; }
  #logoutBtn {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 13px;
    text-decoration: underline;
  }

  .your-code-block {
    margin: 28px 24px 8px 24px;
    padding: 18px 20px;
    background: var(--clay);
    border-radius: 4px;
  }
  .your-code-label {
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .your-code-value {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.06em;
    font-variant-numeric: tabular-nums;
  }

  .start-chat-block {
    margin: 24px 24px 0 24px;
  }
  .start-chat-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }
  .start-chat-row input { flex: 1; }
  .start-chat-row button {
    padding: 0 18px;
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 14px;
    font-weight: 600;
  }

  .convo-list {
    margin-top: 32px;
    padding: 0 24px 24px 24px;
    overflow-y: auto;
    flex: 1;
  }
  .convo-list-label {
    font-size: 12px;
    color: var(--ink-soft);
    text-transform: none;
    margin-bottom: 10px;
  }
  .convo-item {
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 4px;
    margin-bottom: 8px;
    cursor: pointer;
    background: #fff;
  }
  .convo-item:hover { border-color: var(--accent); }
  .convo-item .code { font-weight: 600; font-size: 15px; }
  .convo-item .preview {
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .empty-state {
    color: var(--ink-soft);
    font-size: 14px;
    padding: 8px 0;
  }

  /* ---------- Chat screen ---------- */
  .chat-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .back-btn {
    background: none;
    border: none;
    font-size: 20px;
    color: var(--ink);
    padding: 0 4px;
  }
  .chat-header .code {
    font-weight: 600;
    font-size: 16px;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .bubble {
    max-width: 72%;
    padding: 10px 14px;
    border-radius: 4px;
    font-size: 15px;
    line-height: 1.4;
    word-wrap: break-word;
  }
  .bubble.mine {
    align-self: flex-end;
    background: var(--accent);
    color: #fff;
  }
  .bubble.theirs {
    align-self: flex-start;
    background: var(--clay);
    color: var(--ink);
  }
  .bubble-time {
    font-size: 10px;
    opacity: 0.7;
    margin-top: 4px;
    display: block;
  }

  .composer {
    padding: 14px 20px;
    border-top: 1px solid var(--line);
    display: flex;
    gap: 10px;
  }
  .composer input {
    flex: 1;
  }
  .composer button {
    padding: 0 20px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 4px;
    font-weight: 600;
  }
  .composer button:hover { background: var(--accent-dark); }
</style>
</head>
<body>
<div id="app">

  <!-- AUTH SCREEN -->
  <div id="authScreen" class="screen active">
    <div class="center-wrap">
      <div class="panel">
        <div class="wordmark">WIRE</div>
        <h1 id="authTitle">Sign in</h1>

        <label for="authEmail">Email</label>
        <input type="email" id="authEmail" placeholder="you@example.com" />

        <label for="authPassword">Password</label>
        <input type="password" id="authPassword" placeholder="••••••••" />

        <label id="usernameLabel" for="authUsername" style="display:none;">Display name</label>
        <input type="text" id="authUsername" placeholder="What should people call you?" style="display:none;" />

        <button class="btn-primary" id="authSubmitBtn">Sign in</button>
        <div class="error-text" id="authError"></div>

        <div class="switch-row">
          <span id="switchPrompt">Don't have an account?</span>
          <button class="link-btn" id="switchModeBtn">Sign up</button>
        </div>
      </div>
    </div>
  </div>

  <!-- HOME SCREEN -->
  <div id="homeScreen" class="screen">
    <div class="home-header">
      <div class="wordmark">WIRE</div>
      <button id="logoutBtn">Sign out</button>
    </div>

    <div class="your-code-block">
      <div class="your-code-label">Your code — share it so someone can find you</div>
      <div class="your-code-value" id="yourCode">------</div>
    </div>

    <div class="start-chat-block">
      <label for="friendCodeInput">Start a chat with a code</label>
      <div class="start-chat-row">
        <input type="text" id="friendCodeInput" placeholder="e.g. AB12CD" />
        <button id="findBtn">Find</button>
      </div>
      <div class="error-text" id="findError"></div>
    </div>

    <div class="convo-list">
      <div class="convo-list-label">Conversations</div>
      <div id="convoItems"></div>
    </div>
  </div>

  <!-- CHAT SCREEN -->
  <div id="chatScreen" class="screen">
    <div class="chat-header">
      <button class="back-btn" id="backBtn">←</button>
      <div class="code" id="chatWithCode">—</div>
    </div>
    <div class="messages" id="messagesEl"></div>
    <div class="composer">
      <input type="text" id="messageInput" placeholder="Type a message…" />
      <button id="sendBtn">Send</button>
    </div>
  </div>

</div>

<script>
(function () {
// ====== CONFIG — fill these in ======
const SUPABASE_URL = "https://vymgetntxoedcnrsnlhx.supabase.co";
const SUPABASE_KEY = "sb_publishable_n77TAliMjWJBrsnMiFWTPA_ooLzPd1l";
// =====================================

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ---------- State ----------
let currentUser = null;      // supabase auth user
let currentProfile = null;   // row from profiles table
let isSignUpMode = false;
let activeConversation = null; // {id, otherCode}
let messageChannel = null;

// ---------- Helpers ----------
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function generateCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // no ambiguous chars
  let code = "";
  for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}

function formatTime(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

// ---------- Auth screen behavior ----------
const authTitle = document.getElementById("authTitle");
const authSubmitBtn = document.getElementById("authSubmitBtn");
const switchPrompt = document.getElementById("switchPrompt");
const switchModeBtn = document.getElementById("switchModeBtn");
const usernameLabel = document.getElementById("usernameLabel");
const authUsername = document.getElementById("authUsername");
const authError = document.getElementById("authError");

switchModeBtn.addEventListener("click", () => {
  isSignUpMode = !isSignUpMode;
  authError.textContent = "";
  if (isSignUpMode) {
    authTitle.textContent = "Create an account";
    authSubmitBtn.textContent = "Sign up";
    switchPrompt.textContent = "Already have an account?";
    switchModeBtn.textContent = "Sign in";
    usernameLabel.style.display = "block";
    authUsername.style.display = "block";
  } else {
    authTitle.textContent = "Sign in";
    authSubmitBtn.textContent = "Sign in";
    switchPrompt.textContent = "Don't have an account?";
    switchModeBtn.textContent = "Sign up";
    usernameLabel.style.display = "none";
    authUsername.style.display = "none";
  }
});

authSubmitBtn.addEventListener("click", async () => {
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;
  authError.textContent = "";

  if (!email || !password) {
    authError.textContent = "Enter an email and password.";
    return;
  }

  authSubmitBtn.disabled = true;

  try {
    if (isSignUpMode) {
      const username = authUsername.value.trim() || email.split("@")[0];
      const { data, error } = await supabase.auth.signUp({ email, password });
      if (error) throw error;

      // If email confirmation is off, session exists right away
      const user = data.user;
      if (!user) throw new Error("Check your email to confirm your account, then sign in.");

      // Create the profile row with a unique code
      let code = generateCode();
      let attempts = 0;
      let inserted = false;
      while (attempts < 5 && !inserted) {
        const { error: profileError } = await supabase.from("profiles").insert({
          id: user.id,
          username: username,
          unique_code: code
        });
        if (!profileError) {
          inserted = true;
        } else if (profileError.message.includes("duplicate")) {
          code = generateCode();
          attempts++;
        } else {
          throw profileError;
        }
      }
      if (!inserted) throw new Error("Could not generate a unique code, try again.");

      await loadSessionAndGo();
    } else {
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) throw error;
      await loadSessionAndGo();
    }
  } catch (err) {
    authError.textContent = err.message || "Something went wrong.";
  } finally {
    authSubmitBtn.disabled = false;
  }
});

// ---------- Load session / profile, then show home ----------
async function loadSessionAndGo() {
  const { data: { user } } = await supabase.auth.getUser();
  if (!user) { showScreen("authScreen"); return; }
  currentUser = user;

  const { data: profile, error } = await supabase
    .from("profiles")
    .select("*")
    .eq("id", user.id)
    .single();

  if (error || !profile) {
    authError.textContent = "Could not load your profile.";
    return;
  }
  currentProfile = profile;
  document.getElementById("yourCode").textContent = profile.unique_code;
  showScreen("homeScreen");
  loadConversations();
}

// ---------- Sign out ----------
document.getElementById("logoutBtn").addEventListener("click", async () => {
  await supabase.auth.signOut();
  currentUser = null;
  currentProfile = null;
  showScreen("authScreen");
});

// ---------- Find / start a conversation ----------
const findBtn = document.getElementById("findBtn");
const findError = document.getElementById("findError");

findBtn.addEventListener("click", async () => {
  const code = document.getElementById("friendCodeInput").value.trim().toUpperCase();
  findError.textContent = "";
  if (!code) return;

  if (code === currentProfile.unique_code) {
    findError.textContent = "That's your own code.";
    return;
  }

  const { data: otherProfile, error } = await supabase
    .from("profiles")
    .select("*")
    .eq("unique_code", code)
    .single();

  if (error || !otherProfile) {
    findError.textContent = "No user found with that code.";
    return;
  }

  // Check if a conversation already exists between the two users (either direction)
  const { data: existing } = await supabase
    .from("conversations")
    .select("*")
    .or(
      `and(user_a_id.eq.${currentProfile.id},user_b_id.eq.${otherProfile.id}),and(user_a_id.eq.${otherProfile.id},user_b_id.eq.${currentProfile.id})`
    );

  let conversation;
  if (existing && existing.length > 0) {
    conversation = existing[0];
  } else {
    const { data: created, error: createError } = await supabase
      .from("conversations")
      .insert({ user_a_id: currentProfile.id, user_b_id: otherProfile.id })
      .select()
      .single();
    if (createError) {
      findError.textContent = "Could not start chat.";
      return;
    }
    conversation = created;
  }

  document.getElementById("friendCodeInput").value = "";
  openChat(conversation, otherProfile.unique_code);
  loadConversations();
});

// ---------- Load conversation list ----------
async function loadConversations() {
  const { data: convos, error } = await supabase
    .from("conversations")
    .select("*")
    .or(`user_a_id.eq.${currentProfile.id},user_b_id.eq.${currentProfile.id}`)
    .order("created_at", { ascending: false });

  const container = document.getElementById("convoItems");
  container.innerHTML = "";

  if (error || !convos || convos.length === 0) {
    container.innerHTML = `<div class="empty-state">No conversations yet. Enter a code above to start one.</div>`;
    return;
  }

  for (const convo of convos) {
    const otherId = convo.user_a_id === currentProfile.id ? convo.user_b_id : convo.user_a_id;
    const { data: otherProfile } = await supabase
      .from("profiles")
      .select("unique_code, username")
      .eq("id", otherId)
      .single();

    const item = document.createElement("div");
    item.className = "convo-item";
    item.innerHTML = `
      <div class="code">${otherProfile ? otherProfile.username : "Unknown"} · ${otherProfile ? otherProfile.unique_code : "??????"}</div>
      <div class="preview">Tap to open</div>
    `;
    item.addEventListener("click", () => openChat(convo, otherProfile ? otherProfile.unique_code : "??????"));
    container.appendChild(item);
  }
}

// ---------- Open a chat ----------
async function openChat(conversation, otherCode) {
  activeConversation = { id: conversation.id, otherCode };
  document.getElementById("chatWithCode").textContent = otherCode;
  showScreen("chatScreen");
  await loadMessages();
  subscribeToMessages();
}

document.getElementById("backBtn").addEventListener("click", () => {
  if (messageChannel) {
    supabase.removeChannel(messageChannel);
    messageChannel = null;
  }
  activeConversation = null;
  showScreen("homeScreen");
  loadConversations();
});

// ---------- Load messages for active conversation ----------
async function loadMessages() {
  const { data: messages, error } = await supabase
    .from("messages")
    .select("*")
    .eq("conversation_id", activeConversation.id)
    .order("created_at", { ascending: true });

  const container = document.getElementById("messagesEl");
  container.innerHTML = "";
  if (!error && messages) {
    for (const m of messages) renderMessage(m);
  }
  container.scrollTop = container.scrollHeight;
}

function renderMessage(m) {
  const container = document.getElementById("messagesEl");
  const div = document.createElement("div");
  const mine = m.sender_id === currentProfile.id;
  div.className = "bubble " + (mine ? "mine" : "theirs");
  div.innerHTML = `${escapeHtml(m.content)}<span class="bubble-time">${formatTime(m.created_at)}</span>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

// ---------- Realtime subscription ----------
function subscribeToMessages() {
  if (messageChannel) {
    supabase.removeChannel(messageChannel);
  }
  messageChannel = supabase
    .channel("messages-" + activeConversation.id)
    .on(
      "postgres_changes",
      {
        event: "INSERT",
        schema: "public",
        table: "messages",
        filter: `conversation_id=eq.${activeConversation.id}`
      },
      (payload) => {
        renderMessage(payload.new);
      }
    )
    .subscribe();
}

// ---------- Send message ----------
async function sendMessage() {
  const input = document.getElementById("messageInput");
  const content = input.value.trim();
  if (!content || !activeConversation) return;
  input.value = "";

  const { error } = await supabase.from("messages").insert({
    conversation_id: activeConversation.id,
    sender_id: currentProfile.id,
    content: content
  });
  if (error) {
    alert("Message failed to send: " + error.message);
  }
}

document.getElementById("sendBtn").addEventListener("click", sendMessage);
document.getElementById("messageInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendMessage();
});

// ---------- On load, check if already logged in ----------
(async function init() {
  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    await loadSessionAndGo();
  } else {
    showScreen("authScreen");
  }
})();

})();
</script>
</body>
</html>
